server:
  port: 8080

spring:
  application:
    name: bootbank-api-gw
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - PrefixPath=/bootbank-auth-service

        - id: card-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/cards/**
          filters:
            - PrefixPath=/bootbank-card-ms

        - id: deposit-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/deposits/**
          filters:
            - PrefixPath=/bootbank-deposit-ms

        - id: loan-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/loans/**, /api/v1/credit/**
          filters:
            - PrefixPath=/bootbank-loan-ms
  profiles:
    include:
      - management

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
